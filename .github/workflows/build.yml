name: Build BEE J

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (solo paquetes que existen)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Caché del modelo de voz
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-en-us
          key: vosk-model-small-en-us-0.15

      - name: Descargar modelo de voz (Vosk, licencia Apache 2.0)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 6 --retry-delay 8 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip -d model_tmp
          mv model_tmp/vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          rm -rf model.zip model_tmp

      - name: Comprobar modelo
        run: |
          test -f app/src/main/assets/model-en-us/am/final.mdl
          du -sh app/src/main/assets/model-en-us

      - name: Pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar debug y release (R8 activo en release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Nombrar APK, medir tamaño y verificar firma
        run: |
          VERSION="$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME}"; else NAME="v${VERSION}"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$NAME" != "v${VERSION}" ]]; then
            echo "::warning::El tag ${NAME} no coincide con versionName ${VERSION} en app/build.gradle.kts"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BEE-J-${NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BEE-J-${NAME}-debug.apk"
          echo "### Tamaño de los APK" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Carpetas lib/ (32 y 64 bits)" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "dist/BEE-J-${NAME}.apk" | grep -oE 'lib/[a-z0-9-]+/' | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)"
          for f in dist/*.apk; do echo "$f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "Signer #1 certificate SHA-256" ; done | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Subir APK release
        uses: actions/upload-artifact@v4
        with:
          name: BEE-J-release
          path: dist/BEE-J-${{ env.APK_NAME }}.apk

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: BEE-J-debug
          path: dist/*-debug.apk

      - name: Informe de pruebas (si algo falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: app/build/reports/tests

      - name: Publicar Release (solo con tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BEE-J-${{ env.APK_NAME }}.apk
